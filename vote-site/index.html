<!doctype html>
<html lang="zh-CN" data-presence-standalone="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>牙牙消息 - 计分榜</title><link rel="icon" href="/vote/assets/logo.png"><script src="/vote/assets/boot.js?v=20261024-6"></script><link rel="stylesheet" href="/vote/assets/vote.css?v=20261101-header"><script src="/vote/assets/vote.js?v=20261101-year" defer></script><script src="/src/web/presence-client.js?v=2a370c2d7182" defer></script></head>
<body><header class="site-header"><a href="/" class="brand"><img src="/vote/assets/logo.png" alt="" width="46" height="46"><span class="brand-text"><span class="brand-title">牙牙消息</span><span class="brand-subtitle">by yk1z</span></span></a><nav class="header-actions" aria-label="页面导航"><a class="ranking-link" href="/gift">礼物榜</a><a href="/">返回首页</a><button id="theme-toggle" aria-label="切换明暗主题">◐</button></nav></header>
<main>
<div id="error" class="error" role="alert" hidden></div>
<section class="metrics" aria-label="已采集统计"><article><span>房间分数</span><strong id="room-score">—</strong></article><article><span>直播间分数</span><strong id="live-score">—</strong></article><article><span>合计分数</span><strong id="total-score">—</strong></article></section>
<section class="filters"><input id="search" type="search" placeholder="搜索昵称、用户 ID 或成员" aria-label="搜索昵称、用户 ID 或成员" autocomplete="off"><div class="search-fields"><select id="source" aria-label="筛选分数来源"><option value="">全部分数</option><option value="room">房间分数</option><option value="live">直播间分数</option></select><select id="group" aria-label="筛选分团"><option value="">全部分团</option><option>SNH48</option><option>GNZ48</option><option>BEJ48</option><option>CKG48</option><option>CGT48</option></select><select id="team" aria-label="筛选队伍"><option value="">全部队伍</option></select></div></section>
<section class="data-panel"><div class="panel-heading"><div class="view-tabs" role="group" aria-label="查看榜单或记录"><button class="selected" data-view="members">成员榜</button><button data-view="users">用户榜</button><button data-view="events">计分记录</button></div><div id="active-filter" class="active-filter" hidden><span id="selection-text"></span><button id="clear-filter" aria-label="清除筛选">×</button></div><span id="live-label">连接中</span></div><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"><tr><td class="empty">加载中…</td></tr></tbody></table></div><div class="pagination"><span id="page-label">—</span><div><button id="previous">上一页</button><button id="next">下一页</button></div></div></section>
</main>
<dialog id="details"><div class="dialog-heading"><div><h2 id="detail-title">投分明细</h2></div><button id="close-detail" aria-label="关闭明细">×</button></div><div class="dialog-tools"><input id="detail-search" type="search" placeholder="搜索投分用户 / ID" aria-label="搜索该成员的投分用户"><button id="all-records">计分记录 →</button></div><div class="table-scroll dialog-table"><table><thead><tr><th class="rank-column">排名</th><th id="detail-person-heading" class="person-column">投分用户</th><th id="detail-group-heading" class="group-column" hidden>分团</th><th id="detail-team-heading" class="team-column" hidden>队伍</th><th class="number">房间</th><th class="number">直播间</th><th class="number score-heading">分数</th><th class="number">笔数</th><th class="action-column"></th></tr></thead><tbody id="detail-body"></tbody></table></div><div class="pagination"><span id="detail-page-label"></span><div><button id="detail-previous">上一页</button><button id="detail-next">下一页</button></div></div></dialog>
<dialog id="profile-window" class="profile-window" aria-label="用户主页"><iframe id="profile-frame" title="用户主页" src="about:blank"></iframe></dialog>
</body></html>

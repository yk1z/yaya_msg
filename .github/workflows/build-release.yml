name: Build Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      replace_mac_release_tag:
        description: Existing release tag to upload macOS DMG installers to
        required: false
        type: string
      replace_linux_release_tag:
        description: Existing release tag to upload the Linux DEB installer to
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            arch: x64
            verify_platform: windows
            artifact_name: yaya-msg-windows
            build_command: npm run dist -- --win nsis --x64 --publish never
            artifact_path: |
              dist/*.exe
          - os: macos-latest
            label: macOS
            arch: arm64
            verify_platform: macos
            artifact_name: yaya-msg-macos
            build_command: npm run dist -- --mac dmg --arm64 --publish never
            artifact_path: |
              dist/*.dmg
          - os: ubuntu-latest
            label: Linux
            arch: x64
            verify_platform: linux
            artifact_name: yaya-msg-linux
            build_command: npm run dist -- --linux deb --x64 --publish never
            artifact_path: |
              dist/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: ${{ matrix.build_command }}

      - name: Verify installer contents and protocol registration
        run: python .github/scripts/verify-installers.py ${{ matrix.verify_platform }} --arch ${{ matrix.arch }}

      - name: Replace macOS asset in existing release
        if: matrix.label == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.replace_mac_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 dist/*.dmg
          gh release upload "${{ inputs.replace_mac_release_tag }}" dist/*.dmg --clobber

      - name: Replace Linux asset in existing release
        if: matrix.label == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.replace_linux_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/*.deb
          gh release upload "${{ inputs.replace_linux_release_tag }}" dist/*.deb --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Remove old release assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
